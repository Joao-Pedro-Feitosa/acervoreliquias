<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel – O Acervo Relíquias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#17110C;--ink:#F1E6D6;--mut:#A8977F;--line:#3A2C1F;--card:#241B12;--tag:#F2A33A;--tagink:#1A120A;--red:#E8793A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.15rem;margin:0 0 12px}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.88rem;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:600 .95rem system-ui,sans-serif;padding:10px 14px;border-radius:4px;border:0;cursor:pointer;background:var(--tag);color:var(--tagink)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:var(--red);border:1px solid var(--red)}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.tabs button[aria-pressed=false]{background:transparent;color:var(--ink);border:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center}
.item img,.item .ph{width:54px;height:72px;object-fit:cover;border-radius:2px;background:#000;flex:none}
.item .ph{display:grid;place-items:center;font-size:.7rem;color:var(--mut)}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t span{color:var(--mut);font-size:.88rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts select{width:auto;padding:7px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto{width:84px;text-align:center;font-size:.75rem}
.foto img{width:84px;height:112px;object-fit:cover;border-radius:2px;display:block}
.foto div{display:flex;justify-content:space-between}
.foto button{padding:2px 7px;font-size:.85rem}
.msg{color:var(--tag);min-height:1.4em;margin:8px 0 0;font-size:.92rem}
.err{color:var(--red)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ink)}
.chk input{width:auto}
</style>
</head>
<body>
<div class="wrap">

<section id="login" hidden>
<div class="top"><h1>Painel do Acervo</h1></div>
<form class="card" id="lf">
<h2>Entrar</h2>
<label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Senha (mínimo 8 caracteres)</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
<div class="acts"><button type="submit">Entrar</button><button type="button" class="alt" id="su" hidden>Criar conta (primeiro acesso)</button></div>
<p class="msg" id="lm"></p>
</form>
</section>

<section id="denied" hidden>
<div class="top"><h1>Acesso negado</h1><button class="alt" id="out2">Sair</button></div>
<div class="card">Esta conta não é a administradora do site.</div>
</section>

<section id="app" hidden>
<div class="top"><h1>Painel do Acervo</h1><div class="acts" style="margin:0"><a href="index.html" style="color:var(--ink)">Ver vitrine</a><button class="alt" id="out">Sair</button></div></div>
<div class="tabs" role="group" aria-label="Seções">
<button id="t1" aria-pressed="true">Revistas</button><button id="t2" aria-pressed="false">Nova revista</button><button id="t3" aria-pressed="false">Loja</button><button id="t4" aria-pressed="false">Procuras</button>
</div>

<div id="p1"><div class="row"><input id="lq" type="search" placeholder="Buscar na lista" aria-label="Buscar"><select id="lf2" aria-label="Filtrar situação"><option value="">Todas</option><option value="disponivel">Disponíveis</option><option value="reservada">Reservadas</option><option value="vendida">Vendidas</option><option value="rascunho">Rascunhos</option></select></div><p class="msg" id="count"></p><div id="list"></div></div>

<div id="p4" hidden><p class="msg" id="pcount"></p><div id="plist"></div></div>

<form id="p2" class="card" hidden>
<h2 id="ft">Nova revista</h2>
<div class="row">
<div><label for="f_titulo">Título da revista</label><input id="f_titulo" maxlength="160" placeholder="Ex.: Quatro Rodas, Playboy, Superinteressante" required></div>
<div><label for="f_cat">Categoria</label><input id="f_cat" list="categorias-lista" maxlength="80" placeholder="Escolha ou digite uma categoria" required><datalist id="categorias-lista"><option value="Adulto"><option value="Automóveis"><option value="Ciência e conhecimento"><option value="Cinema e televisão"><option value="Esportes"><option value="Games e tecnologia"><option value="Música"><option value="Notícias e atualidades"><option value="Quadrinhos"><option value="Variedades"><option value="Outras"></datalist></div>
</div>
<div class="row"><div><label for="f_ed">Edição</label><input id="f_ed" placeholder="nº 215"></div><div><label for="f_ano">Ano de publicação</label><input id="f_ano" type="number" min="1900" max="2100"></div></div>
<div class="row">
<div><label for="f_preco">Preço (R$)</label><input id="f_preco" type="number" step="0.01" min="0" required></div>
<div><label for="f_capa">Quem está na capa (opcional)</label><input id="f_capa"></div>
</div>
<div class="row"><div><label for="f_po">Pôster</label><select id="f_po"><option value="">Não informado</option><option value="completo">Completo</option><option value="destacado">Destacado (retirado)</option><option value="ausente">Sem pôster na edição</option></select></div>
<div><label for="f_lo">Lombada</label><select id="f_lo"><option value="">Não informado</option><option value="firme">Firme</option><option value="fraca">Cola ressecada / solta</option></select></div></div>
<div class="row"><div><label for="f_tp">Tipo</label><select id="f_tp"><option value="">Regular</option><option>Edição especial</option><option>Capa alternativa</option><option>Suplemento</option></select></div>
<div><label for="f_ob">Observações do estado</label><input id="f_ob" maxlength="160" placeholder="Ex.: canto amassado"></div></div>
<div class="row">
<div><label for="f_est">Estado de conservação</label><select id="f_est"><option>Ótimo</option><option>Muito bom</option><option selected>Bom</option><option>Regular</option><option>Com defeitos</option></select></div>
<div><label for="f_st">Situação</label><select id="f_st"><option value="disponivel">Disponível</option><option value="reservada">Reservada</option><option value="vendida">Vendida</option><option value="rascunho">Rascunho (escondida)</option></select></div>
</div>
<label class="chk"><input type="checkbox" id="f_dest"> Destaque (aparece primeiro)</label>
<label class="chk"><input type="checkbox" id="f_rar"> Raridade / edição especial</label>
<label for="f_files">Fotos (a primeira é a capa; use as outras para mostrar o estado)</label>
<input id="f_files" type="file" accept="image/*" multiple>
<div class="fotos" id="fotos"></div>
<div class="acts"><button type="submit" id="save">Salvar revista</button><button type="button" class="alt" id="cancel">Cancelar</button></div>
<p class="msg" id="fm"></p>
</form>

<form id="p3" class="card" hidden>
<h2>Dados da loja</h2>
<label for="c_nome">Nome da loja</label><input id="c_nome" required>
<label for="c_wa">WhatsApp (com DDD, só números. Ex.: 62999999999)</label><input id="c_wa" inputmode="numeric" required>
<label for="c_ig">Instagram (sem @)</label><input id="c_ig">
<label for="c_end">Endereço / horário (opcional)</label><input id="c_end">
<label for="c_pix">Chave Pix (aparece no carrinho)</label><input id="c_pix">
<div class="row"><div><label for="c_fr">Frete fixo (R$). Vazio = a combinar</label><input id="c_fr" type="number" step="0.01" min="0"></div>
<div><label for="c_fg">Frete grátis acima de (R$)</label><input id="c_fg" type="number" step="0.01" min="0"></div></div>
<label for="c_sobre">Texto "Sobre o acervo" (vazio = esconde a seção)</label><textarea id="c_sobre" rows="5" style="width:100%;padding:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit"></textarea>
<label for="c_env">Como enviamos: embalagem, prazo, rastreio (vazio = esconde a seção)</label><textarea id="c_env" rows="4"></textarea>
<label for="c_sf">Foto do "Sobre" (opcional)</label><input id="c_sf" type="file" accept="image/*"><input id="c_sfu" type="hidden">
<label class="chk"><input type="checkbox" id="c_blur"> Desfocar as capas na vitrine (clicar abre nítida)</label>
<div class="acts"><button type="submit">Salvar</button></div>
<p class="msg" id="cm"></p>
</form>
</section>
</div>

<script>
var SB="https://bbxjmgsspiwhwpppmlus.supabase.co", KEY="sb_publishable_9IIaStSDOL4TxDsvmf2WrA_wft5Uzrl";
var sb=supabase.createClient(SB,KEY), $=function(i){return document.getElementById(i)};
var list=[], editId=null, fotos=[], orig=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(p){p=Number(p);return "R$ "+(p%1?p.toFixed(2).replace(".",","):p)}
function view(n){["login","denied","app"].forEach(function(x){$(x).hidden=x!==n})}
function say(id,t,bad){var e=$(id);e.textContent=t||"";e.className="msg"+(bad?" err":"")}

async function boot(){if(location.hash==="#primeiro-acesso")$("su").hidden=false;
  var s=(await sb.auth.getSession()).data.session;
  if(!s){view("login");return}
  var r=await sb.rpc("claim_admin");
  if(r.error||!r.data){view("denied");return}
  view("app");await loadList();await loadCfg();
}
$("lf").onsubmit=async function(e){
  e.preventDefault();say("lm","Entrando…");
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error){say("lm","E-mail ou senha incorretos.",1);return}
  say("lm","");boot();
};
$("su").onclick=async function(){
  var em=$("em").value.trim(),pw=$("pw").value;
  if(!em||pw.length<8){say("lm","Preencha e-mail e uma senha com 8 caracteres ou mais.",1);return}
  var btn=$("su");btn.disabled=true;say("lm","Criando conta…");
  var r=await sb.auth.signUp({email:em,password:pw});
  setTimeout(function(){btn.disabled=false},60000);
  if(r.error){
    var m=r.error.message||"";
    say("lm",/after \d+ seconds|rate limit/i.test(m)?"Aguarde 1 minuto antes de tentar de novo. Se você já clicou antes, a conta provavelmente foi criada: confira o e-mail.":"Não foi possível criar a conta: "+m,1);
    return;
  }
  say("lm",r.data.session?"Conta criada.":"Conta criada. Abra o e-mail de confirmação, clique no link e depois entre aqui.");
  if(r.data.session)boot();
};
async function logout(){await sb.auth.signOut();view("login")}
$("out").onclick=$("out2").onclick=logout;

function tab(n){
  [1,2,3,4].forEach(function(i){$("p"+i).hidden=i!==n;$("t"+i).setAttribute("aria-pressed",i===n)});
}
$("t1").onclick=function(){tab(1)};
$("t2").onclick=function(){newForm();tab(2)};
$("t3").onclick=function(){tab(3)};
$("t4").onclick=function(){tab(4);loadProc()};

var stats={};
function statTxt(id){var s=stats[id]||{};return "Viram "+(s.ver||0)+" · No carrinho "+(s.carrinho||0)+" · WhatsApp "+(s.whatsapp||0)}
async function loadStats(){
  var r=await sb.rpc("contagem_cliques");stats={};
  (r.data||[]).forEach(function(x){(stats[x.revista_id]=stats[x.revista_id]||{})[x.tipo]=Number(x.total)});
}
async function loadList(){await loadList0();filt()}
function filt(){var t=$("lq").value.toLowerCase(),s=$("lf2").value;Array.prototype.forEach.call($("list").children,function(c){c.hidden=!((!s||c.dataset.s===s)&&c.dataset.q.indexOf(t)>-1)})}
$("lq").oninput=$("lf2").onchange=filt;
async function loadList0(){
  await loadStats();
  var r=await sb.from("revistas").select("*").order("criado_em",{ascending:false});
  if(r.error){say("count","Erro ao carregar: "+r.error.message,1);return}
  list=r.data;refreshCategories();say("count",list.length+(list.length===1?" revista":" revistas")+" cadastradas");
  $("list").innerHTML=list.map(function(m,i){
    var f=(m.fotos||[])[0];
    return '<div class="card item" data-s="'+m.status+'" data-q="'+esc((m.titulo+" "+(m.edicao||"")+" "+(m.ano||"")+" "+(m.capa_nome||"")).toLowerCase())+'">'+(f?'<img src="'+esc(f)+'" alt="">':'<div class="ph">sem foto</div>')+
    '<div class="t"><b>'+esc(m.titulo)+' '+esc(m.edicao)+(m.destaque?' ★':'')+'</b><span>'+esc(m.ano)+' · '+esc(m.estado)+' · '+money(m.preco)+' · '+(m.fotos||[]).length+' foto(s)</span><br><span>'+statTxt(m.id)+'</span>'+
    '<div class="acts"><select data-st="'+m.id+'" aria-label="Situação">'+
    ["disponivel","reservada","vendida","rascunho"].map(function(x){return '<option value="'+x+'"'+(m.status===x?' selected':'')+'>'+{disponivel:"Disponível",reservada:"Reservada",vendida:"Vendida",rascunho:"Rascunho"}[x]+'</option>'}).join("")+
    '</select><button class="alt" data-ed="'+i+'">Editar</button><button class="alt" data-dup="'+i+'">Duplicar</button><button class="del" data-rm="'+i+'">Excluir</button></div></div></div>';
  }).join("");
}
$("list").addEventListener("change",async function(e){
  var id=e.target.dataset.st;if(!id)return;
  var r=await sb.from("revistas").update({status:e.target.value,reservado_ate:null}).eq("id",id);
  if(r.error)say("count","Erro ao salvar: "+r.error.message,1);else{say("count","Situação atualizada.");e.target.closest(".card").dataset.s=e.target.value}
});
$("list").addEventListener("click",async function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.ed!==undefined){fill(list[+b.dataset.ed]);tab(2)}
  if(b.dataset.dup!==undefined){var m0=list[+b.dataset.dup];fill(m0);editId=null;fotos=[];orig=[];drawFotos();$("f_st").value="rascunho";$("ft").textContent="Nova revista (cópia)";say("fm","Dados copiados sem as fotos. Envie as fotos novas e salve.");tab(2)}
  if(b.dataset.rm!==undefined){
    var m=list[+b.dataset.rm];
    if(!confirm("Excluir "+m.titulo+" "+(m.edicao||"")+" e suas fotos? Isso não pode ser desfeito."))return;
    var outras=[].concat.apply([],list.filter(function(o){return o.id!==m.id}).map(function(o){return o.fotos||[]}));
    var paths=[];(m.fotos||[]).forEach(function(u){if(outras.indexOf(u)<0){var p=pathOf(u);if(p){paths.push(p,p.replace(/\.jpg$/,"_t.jpg"))}}});
    var r=await sb.from("revistas").delete().eq("id",m.id);
    if(r.error){say("count","Erro ao excluir: "+r.error.message,1);return}
    if(paths.length)await sb.storage.from("revistas").remove(paths);
    loadList();
  }
});
function pathOf(u){var i=u.indexOf("/revistas/");return i<0?null:decodeURIComponent(u.slice(i+10))}

function refreshCategories(extra){var known=["Adulto","Automóveis","Ciência e conhecimento","Cinema e televisão","Esportes","Games e tecnologia","Música","Notícias e atualidades","Quadrinhos","Variedades","Outras"];list.forEach(function(m){if(m.categoria&&known.map(function(x){return x.toLowerCase()}).indexOf(m.categoria.toLowerCase())<0)known.push(m.categoria)});if(extra&&known.map(function(x){return x.toLowerCase()}).indexOf(extra.toLowerCase())<0)known.push(extra);$("categorias-lista").innerHTML=known.sort(function(a,b){return a.localeCompare(b,"pt-BR")}).map(function(x){return '<option value="'+esc(x)+'">' }).join("");}
function newForm(){editId=null;fotos=[];orig=[];$("p2").reset();$("ft").textContent="Nova revista";say("fm","");drawFotos();refreshCategories()}
function fill(m){
  editId=m.id;fotos=(m.fotos||[]).slice();$("ft").textContent="Editar revista";say("fm","");
  $("f_titulo").value=m.titulo||"";$("f_cat").value=m.categoria||"";$("f_ed").value=m.edicao||"";$("f_ano").value=m.ano||"";$("f_preco").value=m.preco;refreshCategories();
  $("f_capa").value=m.capa_nome||"";$("f_est").value=m.estado||"Bom";$("f_st").value=m.status;$("f_dest").checked=m.destaque;$("f_rar").checked=m.raridade;$("f_po").value=m.poster||"";$("f_lo").value=m.lombada||"";$("f_tp").value=m.tipo||"";$("f_ob").value=m.obs||"";orig=(m.fotos||[]).slice();drawFotos();
}
function drawFotos(){
  $("fotos").innerHTML=fotos.map(function(u,i){
    return '<div class="foto"><img src="'+esc(u)+'" alt="Foto '+(i+1)+'"><div><button type="button" class="alt" data-mv="'+i+'" data-d="-1" aria-label="Mover para trás">‹</button><button type="button" class="del" data-x="'+i+'" aria-label="Remover foto">×</button><button type="button" class="alt" data-mv="'+i+'" data-d="1" aria-label="Mover para frente">›</button></div>'+(i===0?'capa':'')+'</div>';
  }).join("");
}
$("fotos").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.x!==undefined)fotos.splice(+b.dataset.x,1);
  if(b.dataset.mv!==undefined){var i=+b.dataset.mv,j=i+ +b.dataset.d;if(j>=0&&j<fotos.length){var t=fotos[i];fotos[i]=fotos[j];fotos[j]=t}}
  drawFotos();
});
function shrink(file,max){max=max||1400;
  return new Promise(function(ok,no){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){b?ok(b):no(new Error("falha"))},"image/jpeg",.85);
    };
    img.onerror=function(){no(new Error("imagem inválida"))};img.src=u;
  });
}
$("f_files").onchange=async function(){
  var fs=Array.prototype.slice.call(this.files),n=0;
  for(var i=0;i<fs.length;i++){
    say("fm","Enviando foto "+(i+1)+" de "+fs.length+"…");
    try{
      var blob=await shrink(fs[i]),base=Date.now()+"-"+Math.random().toString(36).slice(2,8),name=base+".jpg";
      var tb=await shrink(fs[i],500);await sb.storage.from("revistas").upload(base+"_t.jpg",tb,{contentType:"image/jpeg"});
      var r=await sb.storage.from("revistas").upload(name,blob,{contentType:"image/jpeg"});
      if(r.error)throw r.error;
      fotos.push(sb.storage.from("revistas").getPublicUrl(name).data.publicUrl);n++;drawFotos();
    }catch(err){say("fm","Erro ao enviar "+fs[i].name+": "+(err.message||err),1);}
  }
  this.value="";if(n)say("fm",n+" foto(s) enviada(s). Lembre de salvar a revista.");
};
function apagar(us,id){var o=[].concat.apply([],list.filter(function(x){return x.id!==id}).map(function(x){return x.fotos||[]})),ps=[];us.forEach(function(u){if(o.indexOf(u)<0){var p=pathOf(u);if(p)ps.push(p,p.replace(/\.jpg$/,"_t.jpg"))}});if(ps.length)return sb.storage.from("revistas").remove(ps)}
$("cancel").onclick=function(){apagar(fotos.filter(function(u){return orig.indexOf(u)<0}),editId);newForm();tab(1)};
$("p2").onsubmit=async function(e){
  e.preventDefault();$("save").disabled=true;say("fm","Salvando…");
  var titulo=$("f_titulo").value.trim(),cat=$("f_cat").value.trim(),row={titulo:titulo,categoria:cat,edicao:$("f_ed").value.trim(),ano:$("f_ano").value?+$("f_ano").value:null,
    capa_nome:$("f_capa").value.trim(),estado:$("f_est").value,preco:+$("f_preco").value,status:$("f_st").value,destaque:$("f_dest").checked,raridade:$("f_rar").checked,fotos:fotos,poster:$("f_po").value||null,lombada:$("f_lo").value||null,tipo:$("f_tp").value||null,obs:$("f_ob").value.trim()||null};
  var r=editId?await sb.from("revistas").update(row).eq("id",editId):await sb.from("revistas").insert(row);
  $("save").disabled=false;
  if(r.error){say("fm","Erro ao salvar: "+r.error.message,1);return}
  if(list.every(function(m){return (m.categoria||"").toLowerCase()!==cat.toLowerCase()}))refreshCategories(cat);
  var rem=orig.filter(function(u){return fotos.indexOf(u)<0}),eid=editId;newForm();tab(1);loadList();say("count","Revista salva.");if(rem.length)apagar(rem,eid);
};

async function loadProc(){
  var r=await sb.from("procuras").select("*").order("criado_em",{ascending:false});
  if(r.error){say("pcount","Erro: "+r.error.message,1);return}
  say("pcount",r.data.length+(r.data.length===1?" pedido de procura":" pedidos de procura"));
  $("plist").innerHTML=r.data.map(function(p){return '<div class="card"'+(p.atendida?' style="opacity:.6"':'')+'><b>'+esc(p.nome)+'</b> · '+esc(p.contato)+'<br>'+esc(p.texto)+'<div class="acts"><span style="color:var(--mut);font-size:.85rem">'+new Date(p.criado_em).toLocaleDateString("pt-BR")+'</span>'+wl(p)+'<button class="alt" data-ok="'+p.id+'" data-v="'+(p.atendida?0:1)+'">'+(p.atendida?"Reabrir":"Marcar atendida")+'</button><button class="del" data-pd="'+p.id+'">Apagar</button></div></div>'}).join("");
}
function wl(p){var d=String(p.contato||"").replace(/\D/g,"");if(d.length<10)return "";if(d.length<=11)d="55"+d;return '<a target="_blank" rel="noopener" style="padding:10px 14px;border:1px solid var(--line);border-radius:4px;color:var(--ink);text-decoration:none" href="https://wa.me/'+d+'?text='+encodeURIComponent("Olá, "+p.nome+"! Vi seu pedido de procura no site do Acervo Relíquias.")+'">Responder</a>'}
$("plist").addEventListener("click",async function(e){var k=e.target.closest("[data-ok]");if(k){await sb.from("procuras").update({atendida:k.dataset.v==="1"}).eq("id",k.dataset.ok);loadProc();return}var b=e.target.closest("[data-pd]");if(!b||!confirm("Apagar este pedido?"))return;await sb.from("procuras").delete().eq("id",b.dataset.pd);loadProc()});
async function loadCfg(){
  var r=await sb.from("config").select("*").eq("id",1).single();
  if(r.data){var d=r.data;$("c_nome").value=d.nome;$("c_wa").value=d.whatsapp;$("c_end").value=d.endereco;$("c_ig").value=d.instagram;$("c_pix").value=d.pix||"";$("c_fr").value=d.frete_fixo==null?"":d.frete_fixo;$("c_fg").value=d.frete_gratis_acima==null?"":d.frete_gratis_acima;$("c_sobre").value=d.sobre||"";$("c_env").value=d.envio_info||"";$("c_sfu").value=d.sobre_foto||"";$("c_blur").checked=d.desfocar}
}
$("p3").onsubmit=async function(e){
  e.preventDefault();
  var wa=$("c_wa").value.replace(/\D/g,"");if(wa.length<=11)wa="55"+wa;
  var sf=$("c_sfu").value,fl=$("c_sf").files[0];
  if(fl){try{var bl=await shrink(fl,1000),nm="sobre-"+Date.now()+".jpg",up=await sb.storage.from("revistas").upload(nm,bl,{contentType:"image/jpeg"});if(up.error)throw up.error;sf=sb.storage.from("revistas").getPublicUrl(nm).data.publicUrl;$("c_sfu").value=sf}catch(er){say("cm","Erro na foto: "+(er.message||er),1);return}}
  var nz=function(v){return v===""?null:+v};
  var r=await sb.from("config").update({nome:$("c_nome").value.trim(),whatsapp:wa,endereco:$("c_end").value.trim(),instagram:$("c_ig").value.trim().replace(/^@/,""),pix:$("c_pix").value.trim(),frete_fixo:nz($("c_fr").value),frete_gratis_acima:nz($("c_fg").value),sobre:$("c_sobre").value.trim(),envio_info:$("c_env").value.trim(),sobre_foto:sf,desfocar:$("c_blur").checked}).eq("id",1);
  if(r.error)say("cm","Erro ao salvar: "+r.error.message,1);else{$("c_wa").value=wa;say("cm","Dados da loja salvos.")}
};
boot();
</script>
